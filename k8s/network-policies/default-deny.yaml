# Заборонити весь вхідний трафік в watchlist-dev
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: watchlist-dev
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Дозволити трафік тільки всередині watchlist-dev
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: watchlist-dev
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# Дозволити зовнішній трафік тільки на frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-external
  namespace: watchlist-dev
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - {}
---
# Дозволити Prometheus збирати метрики з watchlist-dev
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring
  namespace: watchlist-dev
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
---
# Ізолювати default namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: default
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Дозволити трафік всередині default
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: default
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# Дозволити зовнішній доступ до test-app
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-test-app-external
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: test-app
  policyTypes:
    - Ingress
  ingress:
    - {}